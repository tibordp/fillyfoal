name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path web/wasm/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      # Compiled crates, by content hash: workspace crates that didn't
      # change (a fresh checkout's mtimes defeat Cargo's own freshness
      # check) come from the cache. rust-cache keeps the registry and
      # third-party dependencies.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            .
            web/wasm
      - run: cargo clippy --all-targets
      # Each category feature builds alone (with the categories it needs).
      - run: |
          for f in text archive data image av security exec docs system science games; do
            cargo check -p fillyfoal --lib --no-default-features --features "$f"
          done
      # The library has to build for the browser too.
      - run: cargo clippy --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Compiled crates, by content hash: workspace crates that didn't
      # change (a fresh checkout's mtimes defeat Cargo's own freshness
      # check) come from the cache. rust-cache keeps the registry and
      # third-party dependencies.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test

  msrv:
    name: Build (MSRV)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      # Compiled crates, by content hash: workspace crates that didn't
      # change (a fresh checkout's mtimes defeat Cargo's own freshness
      # check) come from the cache. rust-cache keeps the registry and
      # third-party dependencies.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --lib

  web:
    name: Web app
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Compiled crates, by content hash: workspace crates that didn't
      # change (a fresh checkout's mtimes defeat Cargo's own freshness
      # check) come from the cache. rust-cache keeps the registry and
      # third-party dependencies.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: web/wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      # A debug build is enough to typecheck and bundle against; the
      # release one (fat LTO) is the Pages workflow's.
      - run: wasm-pack build wasm --target web --dev --no-opt --out-dir ../src/wasm-pkg --no-pack
      - run: npm run build
