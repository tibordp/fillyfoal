[package]
name = "fillyfoal-wasm"
version = "0.1.0"
edition = "2024"
description = "fillyfoal for the browser: the bindings the web explorer's worker drives"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace: the library stays free of wasm-bindgen and serde.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
fillyfoal = { path = "../.." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Size is what the page pays for on every first load. Against O3, "s" is
# 17 MB instead of 25 (6.5 MB gzipped instead of 8.3) and inflates about a
# third slower, still around 80 MB/s. Nothing panics (the library forbids
# it), so unwinding is dead weight too.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
